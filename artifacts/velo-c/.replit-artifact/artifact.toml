kind = "web"
previewPath = "/"
title = "Velo C"
version = "1.0.0"
id = "artifacts/velo-c"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22916

[services.development]
run = "pnpm --filter @workspace/velo-c run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/velo-c", "run", "build" ]
serve = "static"
publicDir = "artifacts/velo-c/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22916"
BASE_PATH = "/"
